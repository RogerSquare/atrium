name: CI

# Backend tests + task-file audit + frontend build. Runs on every PR into main
# and on pushes to main. See devops-ci-tests-001 — before this, `npm test` was
# wired to `exit 1` and the 17 node:test suites never ran anywhere.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests + task audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Run node:test suites
        working-directory: backend
        run: npm test
      - name: Audit task files
        working-directory: backend
        run: npm run audit:tasks

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
